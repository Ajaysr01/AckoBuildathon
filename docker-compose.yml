services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contract_guard
      POSTGRES_USER: contract_guard
      POSTGRES_PASSWORD: contract_guard
    volumes:
      - contract-guard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_guard -d contract_guard"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://contract_guard:contract_guard@db:5432/contract_guard
      STARTER_KIT_PATH: /starter-kit
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./contract-guard-starter-kit:/starter-kit:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${API_PORT:-8000}}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  contract-guard-data:
